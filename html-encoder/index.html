<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML Entity Encoder | Nexus Tools Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-8 text-slate-900">
  <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl border shadow-sm">
    <h1 class="text-2xl font-bold mb-4">HTML Encoder & Decoder</h1>
    <textarea id="inp" class="w-full h-32 border p-3 font-mono text-sm rounded mb-4" placeholder="Enter HTML code..."></textarea>
    <div class="flex gap-4 mb-4">
      <button onclick="enc()" class="flex-1 bg-blue-600 text-white py-2 rounded">Encode</button>
      <button onclick="dec()" class="flex-1 bg-slate-700 text-white py-2 rounded">Decode</button>
    </div>
    <textarea id="out" readonly class="w-full h-32 border p-3 font-mono text-sm rounded bg-slate-50"></textarea>
  </div>
  <script>
    function enc() {
      const d = document.createElement('div');
      d.innerText = document.getElementById('inp').value;
      document.getElementById('out').value = d.innerHTML;
    }
    function dec() {
      const d = document.createElement('div');
      d.innerHTML = document.getElementById('inp').value;
      document.getElementById('out').value = d.innerText;
    }
  </script>
</body>
</html>
