<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR Code Generator | Nexus Tools Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-50 p-8 text-slate-900">
  <div class="max-w-xl mx-auto bg-white p-6 rounded-xl border shadow-sm text-center">
    <h1 class="text-2xl font-bold mb-4">QR Code Generator</h1>
    <input type="text" id="t" class="w-full border p-3 rounded mb-4" placeholder="Enter URL or text">
    <button onclick="gen()" class="w-full bg-blue-600 text-white py-2 rounded mb-4">Generate QR</button>
    <div id="qrcode" class="flex justify-center"></div>
  </div>
  <script>
    function gen() {
      const t = document.getElementById('t').value;
      document.getElementById('qrcode').innerHTML = '';
      if(t) new QRCode(document.getElementById('qrcode'), t);
    }
  </script>
</body>
</html>
