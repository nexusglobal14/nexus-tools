<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Formatter & Validator | Nexus Tools Hub</title>
  <meta name="description" content="Format, validate, and beautify raw JSON strings instantly in your browser.">
  <link rel="canonical" href="https://tools.nexusglobalit.org/json-formatter/">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style> body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  <nav class="border-b border-slate-200 bg-white fixed w-full z-50 top-0 shadow-xs">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="https://tools.nexusglobalit.org/" class="font-bold text-xl">Nexus <span class="text-blue-600">Tools Hub</span></a>
      <a href="https://tools.nexusglobalit.org/" class="bg-blue-600 text-white text-xs font-semibold px-4 py-2.5 rounded">Back to Tools Hub</a>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-6 py-28 flex-grow w-full space-y-6">
    <div class="bg-white border border-slate-200 p-8 rounded-2xl shadow-sm space-y-4">
      <h1 class="text-2xl font-bold">JSON Formatter & Validator</h1>
      <textarea id="json-input" class="w-full h-40 border p-3 font-mono text-sm rounded bg-slate-50" placeholder='Enter raw JSON here...'></textarea>
      <div class="flex gap-4">
        <button onclick="formatJSON()" class="bg-blue-600 text-white px-6 py-2.5 rounded font-semibold text-sm">Format JSON</button>
        <button onclick="clearJSON()" class="border border-slate-300 px-6 py-2.5 rounded font-semibold text-sm">Clear</button>
      </div>
      <textarea id="json-output" readonly class="w-full h-40 border p-3 font-mono text-sm rounded bg-slate-100" placeholder='Formatted output...'></textarea>
    </div>
  </main>

  <script>
    function formatJSON() {
      try {
        const val = document.getElementById('json-input').value;
        const parsed = JSON.parse(val);
        document.getElementById('json-output').value = JSON.stringify(parsed, null, 2);
      } catch (e) {
        alert('Invalid JSON: ' + e.message);
      }
    }
    function clearJSON() {
      document.getElementById('json-input').value = '';
      document.getElementById('json-output').value = '';
    }
  </script>
</body>
</html>
