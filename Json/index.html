<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Formatter & Validator | Nexus Tools</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Segoe UI', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  
  <nav class="border-b border-slate-200 bg-white fixed w-full z-50 top-0 shadow-xs">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="https://tools.nexusglobalit.org/" class="text-xl font-bold tracking-tight text-slate-900">Nexus <span class="text-blue-600">Tools</span> / JSON Formatter</a>
      <a href="https://www.nexusglobalit.org/" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded transition"><i class="fa-solid fa-house mr-1.5"></i> Main Home</a>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-6 py-28 flex-grow w-full space-y-4">
    <div class="flex items-center justify-between">
      <h1 class="text-xl font-bold text-slate-900">JSON Formatter & Validator</h1>
      <div class="space-x-2">
        <button onclick="formatJSON()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-4 py-2 rounded-lg font-semibold transition">Format JSON</button>
        <button onclick="clearJSON()" class="bg-white border border-slate-300 text-slate-700 text-xs px-4 py-2 rounded-lg font-semibold transition">Clear</button>
      </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase mb-2">Input Raw JSON</label>
        <textarea id="json-input" class="w-full h-96 bg-slate-50 border border-slate-300 rounded-xl p-4 font-mono text-sm focus:outline-none focus:border-blue-600 text-slate-800" placeholder='{"key": "value"}'></textarea>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase mb-2">Formatted Output</label>
        <textarea id="json-output" readonly class="w-full h-96 bg-slate-50 border border-slate-300 rounded-xl p-4 font-mono text-sm text-emerald-700 font-semibold" placeholder="Formatted output will appear here..."></textarea>
      </div>
    </div>
    <p id="json-error" class="text-rose-600 text-xs hidden font-mono bg-rose-50 border border-rose-200 p-3 rounded-lg"></p>
  </main>

  <script>
    function formatJSON() {
      const input = document.getElementById('json-input').value;
      const errorEl = document.getElementById('json-error');
      try {
        if (!input.trim()) return;
        const parsed = JSON.parse(input);
        document.getElementById('json-output').value = JSON.stringify(parsed, null, 2);
        errorEl.classList.add('hidden');
      } catch (err) {
        errorEl.innerText = "Invalid JSON: " + err.message;
        errorEl.classList.remove('hidden');
      }
    }
    function clearJSON() {
      document.getElementById('json-input').value = '';
      document.getElementById('json-output').value = '';
      document.getElementById('json-error').classList.add('hidden');
    }
  </script>
</body>
</html>
