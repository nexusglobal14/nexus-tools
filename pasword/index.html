<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator | Nexus Tools</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Segoe UI', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  
  <nav class="border-b border-slate-200 bg-white fixed w-full z-50 top-0 shadow-xs">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="https://tools.nexusglobalit.org/" class="text-xl font-bold tracking-tight text-slate-900">Nexus <span class="text-blue-600">Tools</span> / Password Generator</a>
      <a href="https://www.nexusglobalit.org/" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded transition"><i class="fa-solid fa-house mr-1.5"></i> Main Home</a>
    </div>
  </nav>

  <main class="max-w-xl mx-auto px-6 py-32 flex-grow w-full space-y-6">
    <div class="bg-white border border-slate-200 p-8 rounded-2xl shadow-xs space-y-6">
      <h1 class="text-xl font-bold text-slate-900">Secure Password Generator</h1>
      
      <div class="flex items-center space-x-2">
        <input type="text" id="pass-output" readonly class="w-full bg-slate-50 border border-slate-300 text-blue-700 font-mono font-bold px-4 py-3 rounded-xl focus:outline-none text-lg">
        <button onclick="copyPassword()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-xl font-semibold transition"><i class="fa-regular fa-copy"></i></button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase mb-2">Length: <span id="length-val" class="text-blue-600 font-bold">16</span></label>
          <input type="range" id="pass-length" min="6" max="32" value="16" oninput="document.getElementById('length-val').innerText = this.value; generatePassword()" class="w-full accent-blue-600 cursor-pointer">
        </div>
        <button onclick="generatePassword()" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-3 rounded-xl font-semibold transition mt-2">Generate New Password</button>
      </div>
    </div>
  </main>

  <script>
    function generatePassword() {
      const length = document.getElementById('pass-length').value;
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+';
      let password = '';
      for (let i = 0; i < length; i++) {
        password += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      document.getElementById('pass-output').value = password;
    }
    function copyPassword() {
      const pass = document.getElementById('pass-output').value;
      if (pass) {
        navigator.clipboard.writeText(pass);
        alert('Password copied!');
      }
    }
    window.onload = generatePassword;
  </script>
</body>
</html>
