<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Base64 Image Encoder | Nexus Tools Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-8 text-slate-900">
  <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl border shadow-sm">
    <h1 class="text-2xl font-bold mb-4">Base64 Image Encoder</h1>
    <input type="file" id="f" accept="image/*" class="mb-4" onchange="enc()">
    <textarea id="out" readonly class="w-full h-48 border p-3 font-mono text-xs rounded bg-slate-50"></textarea>
  </div>
  <script>
    function enc() {
      const file = document.getElementById('f').files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = e => document.getElementById('out').value = e.target.result;
      r.readAsDataURL(file);
    }
  </script>
</body>
</html>
