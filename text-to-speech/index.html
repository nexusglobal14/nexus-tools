<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text to Speech Generator | Nexus Tools Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-8 text-slate-900">
  <div class="max-w-xl mx-auto bg-white p-6 rounded-xl border shadow-sm">
    <h1 class="text-2xl font-bold mb-4">Text to Speech</h1>
    <textarea id="txt" class="w-full h-32 border p-3 rounded mb-4" placeholder="Enter text to speak..."></textarea>
    <button onclick="speak()" class="w-full bg-blue-600 text-white py-2 rounded">Play Audio</button>
  </div>
  <script>
    function speak() {
      const t = document.getElementById('txt').value;
      if (!t) return;
      const u = new SpeechSynthesisUtterance(t);
      window.speechSynthesis.speak(u);
    }
  </script>
</body>
</html>
