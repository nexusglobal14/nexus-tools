<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Security Generator | Nexus Tools Hub</title>
  <link rel="canonical" href="https://tools.nexusglobalit.org/password-generator/">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style> body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  <nav class="border-b border-slate-200 bg-white fixed w-full z-50 top-0 shadow-xs">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="https://tools.nexusglobalit.org/" class="font-bold text-xl">Nexus <span class="text-blue-600">Tools Hub</span></a>
      <a href="https://tools.nexusglobalit.org/" class="bg-blue-600 text-white text-xs font-semibold px-4 py-2.5 rounded">Back to Tools Hub</a>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-6 py-28 flex-grow w-full space-y-6">
    <div class="bg-white border border-slate-200 p-8 rounded-2xl shadow-sm space-y-6">
      <h1 class="text-2xl font-bold">Password Security Generator</h1>
      <div class="flex gap-2">
        <input type="text" id="password-output" readonly class="w-full border p-3 font-mono text-lg rounded bg-slate-50">
        <button onclick="generatePassword()" class="bg-blue-600 text-white px-6 rounded font-semibold text-sm">Generate</button>
      </div>
    </div>
  </main>

  <script>
    function generatePassword() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%^&*!";
      let pass = "";
      for (let i = 0; i < 16; i++) {
        pass += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      document.getElementById('password-output').value = pass;
    }
    window.onload = generatePassword;
  </script>
</body>
</html>
