<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Counter & Text Analyzer | Nexus Tools</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Segoe UI', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  
  <nav class="border-b border-slate-200 bg-white fixed w-full z-50 top-0 shadow-xs">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="https://tools.nexusglobalit.org/" class="text-xl font-bold tracking-tight text-slate-900">Nexus <span class="text-blue-600">Tools</span> / Word Counter</a>
      <a href="https://www.nexusglobalit.org/" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded transition"><i class="fa-solid fa-house mr-1.5"></i> Main Home</a>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-6 py-28 flex-grow w-full space-y-6">
    <h1 class="text-xl font-bold text-slate-900">Word Counter & Text Analyzer</h1>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-6">
      <div class="bg-white border border-slate-200 p-5 rounded-xl text-center">
        <span id="stat-words" class="block text-3xl font-bold text-blue-600">0</span>
        <span class="text-xs font-semibold text-slate-500 uppercase mt-1 block">Words</span>
      </div>
      <div class="bg-white border border-slate-200 p-5 rounded-xl text-center">
        <span id="stat-chars" class="block text-3xl font-bold text-blue-600">0</span>
        <span class="text-xs font-semibold text-slate-500 uppercase mt-1 block">Characters</span>
      </div>
      <div class="bg-white border border-slate-200 p-5 rounded-xl text-center">
        <span id="stat-sentences" class="block text-3xl font-bold text-blue-600">0</span>
        <span class="text-xs font-semibold text-slate-500 uppercase mt-1 block">Sentences</span>
      </div>
      <div class="bg-white border border-slate-200 p-5 rounded-xl text-center">
        <span id="stat-readtime" class="block text-3xl font-bold text-blue-600">0m</span>
        <span class="text-xs font-semibold text-slate-500 uppercase mt-1 block">Read Time</span>
      </div>
    </div>
    <div>
      <textarea id="counter-input" oninput="analyzeText()" class="w-full h-80 bg-slate-50 border border-slate-300 rounded-xl p-4 text-sm focus:outline-none focus:border-blue-600 text-slate-800" placeholder="Type or paste your text here..."></textarea>
    </div>
  </main>

  <script>
    function analyzeText() {
      const text = document.getElementById('counter-input').value;
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      const chars = text.length;
      const sentences = text.trim() ? text.split(/[.!?]+/).filter(Boolean).length : 0;
      const readTime = Math.ceil(words / 200);

      document.getElementById('stat-words').innerText = words;
      document.getElementById('stat-chars').innerText = chars;
      document.getElementById('stat-sentences').innerText = sentences;
      document.getElementById('stat-readtime').innerText = readTime + 'm';
    }
  </script>
</body>
</html>
